name: ARGUS Database Rehearsal

# Runs the full local (Docker/PostGIS) target-database migration rehearsal
# in CI (Executable Migration Plan Fase 3). This workflow NEVER touches
# production: it never sets DATABASE_URL/DIRECT_URL to anything but the
# disposable container the rehearsal harness itself creates via
# docker-compose.argus-migration.yml, and it never runs `prisma migrate
# deploy`/`db push`/`db pull` against any real database. No production
# secrets are read here — the job declares zero `secrets:` inputs.
#
# scripts/migration-rehearsal/Invoke-ArgusFullRehearsal.ps1 already
# orchestrates, in one call: the 11-wave apply cycle, a same-volume
# reapply (backfills exercised twice), the full 100->000 rollback, a
# from-scratch second install, RLS runtime checks, physical validations,
# `prisma validate`, and the repo test suites — see that script's header
# comment for the exact phase-by-phase breakdown. This workflow does not
# reimplement any of that; it only invokes it and fails the job if it
# fails.

on:
  pull_request:
    paths:
      - "prisma/schema.target.prisma"
      - "prisma/target-migrations/**"
      - "scripts/migration-rehearsal/**"
      - "scripts/database-target/**"
      - "src/lib/database-target/**"
      - "tests/database-target/**"
      - "docker-compose.argus-migration.yml"
      - ".github/workflows/argus-database-rehearsal.yml"
  workflow_dispatch: {}

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # No `secrets:`/`env:` block reads any production credential. The only
    # database this job ever talks to is the disposable, loopback-bound
    # container the rehearsal harness creates and destroys itself.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Confirm prisma/schema.prisma and prisma/migrations/ are untouched (pre-run)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- prisma/schema.prisma prisma/migrations/)" ]; then
            echo "::error::prisma/schema.prisma or prisma/migrations/ has a diff before the rehearsal even started — refusing to proceed."
            git status --porcelain -- prisma/schema.prisma prisma/migrations/
            exit 1
          fi

      - name: Confirm Docker is available
        shell: bash
        run: docker info

      - name: prisma validate --schema prisma/schema.target.prisma
        run: npm run db:target:validate

      - name: Unit/contract tests (tests/database-target/)
        run: npm run db:target:test

      - name: Anti-remote-connection guard (assert-local-only.mjs unit tests)
        run: npx vitest run tests/database-target/target-migration-rehearsal-local-only-guard.test.ts tests/database-target/target-client-factory-anti-remote.test.ts

      - name: Full rehearsal — 11 waves, backfill x2, rollback, reinstall from scratch, RLS + physical + prisma + repo tests
        shell: pwsh
        run: |
          ./scripts/migration-rehearsal/Invoke-ArgusFullRehearsal.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Full rehearsal failed — see migration-rehearsal-logs/ and migration-rehearsal-artifacts/ (uploaded below)."
            exit 1
          }

      # ---------------------------------------------------------------------
      # Wave 3 — shadow-write integration proof (Fase 14 of the wave-3
      # mandate). Independent of the full-rehearsal step above (which tears
      # its own container down internally) — this brings up its own
      # disposable container, applies only the waves the wave-3 flow needs
      # (000/010/020/030/040), runs the real Docker/Postgres integration
      # test, then tears down. No secrets, no remote services — same
      # loopback-only container pattern as the full rehearsal.
      # ---------------------------------------------------------------------
      - name: Wave 3 — bring up local Postgres/PostGIS and apply waves 000-040
        shell: pwsh
        run: |
          ./scripts/migration-rehearsal/Reset-ArgusRehearsal.ps1
          . ./scripts/migration-rehearsal/lib/Common.ps1
          Get-ArgusLocalEnv | Out-Null
          Invoke-ArgusPsql -SqlFile "./scripts/migration-rehearsal/fixtures/000_legacy_synthetic_fixtures.sql" | Out-Null
          $waves = @("000_preflight", "010_foundation", "020_identity", "030_ingestion_observation_evidence", "040_incident")
          foreach ($w in $waves) {
            $dir = Join-Path (Join-Path $Script:ArgusRepoRoot "prisma/target-migrations") $w
            $r = & ./scripts/migration-rehearsal/Invoke-Wave.ps1 -WaveDir $dir
            if (-not $r.Success) {
              Write-Error "Wave $w failed during wave-3 setup — see migration-rehearsal-logs/."
              exit 1
            }
          }

      - name: Wave 3 — generate the isolated target Prisma client
        run: npx prisma generate --schema prisma/schema.target.prisma

      - name: Wave 3 — local shadow-write integration (IncidentCandidate creation, idempotency, zero Incident promotion)
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL=$(grep '^DATABASE_URL=' .env.argus-migration.local | cut -d= -f2-)
          export ARGUS_WAVE3_INTEGRATION_TEST=true
          export TARGET_DATABASE_URL="$DATABASE_URL"
          npx vitest run tests/database-target/wave3-local-integration.test.ts

      - name: Wave 3 — no-Incident-promotion + default-flags-off + anti-remote guard
        run: npx vitest run tests/database-target/wave3-no-incident-promotion.test.ts tests/database-target/target-feature-flags.test.ts tests/database-target/target-client-factory-anti-remote.test.ts

      # ---------------------------------------------------------------------
      # Wave 4 — IncidentPromotion/DiscardDecision/IncidentHypothesis
      # integration proof. Reuses the SAME already-up waves 000-040 container
      # from the Wave 3 section above (no second Docker bring-up needed —
      # incident.* also lives in wave 040) — runs before that container is
      # torn down.
      # ---------------------------------------------------------------------
      - name: Wave 4 — human/automated promotion, discard, hypothesis, idempotency, concurrency, audit, RLS coverage
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL=$(grep '^DATABASE_URL=' .env.argus-migration.local | cut -d= -f2-)
          export ARGUS_WAVE3_INTEGRATION_TEST=true
          export TARGET_DATABASE_URL="$DATABASE_URL"
          npx vitest run \
            tests/database-target/incident-promotion-human.test.ts \
            tests/database-target/incident-promotion-automated.test.ts \
            tests/database-target/incident-promotion-idempotency.test.ts \
            tests/database-target/incident-promotion-concurrency.test.ts \
            tests/database-target/discard-decision.test.ts \
            tests/database-target/incident-hypothesis.test.ts \
            tests/database-target/incident-promotion-audit.test.ts \
            tests/database-target/wave4-local-integration.test.ts

      - name: Wave 4 — no-direct-Incident-creation + RLS structural coverage (no Docker needed, but confirmed here alongside the rest of wave 4)
        run: npx vitest run tests/database-target/wave4-no-direct-incident-creation.test.ts tests/database-target/incident-promotion-rls.test.ts

      # ---------------------------------------------------------------------
      # Corrective session — real RLS + zero-residue rollback + risk/command
      # reconciliation. Every one of these is BLOCKING: the mandate forbids
      # accepting "the script exited 0" as proof of rollback correctness, and
      # forbids declaring RLS working when only a superuser exercised it.
      # ---------------------------------------------------------------------
      - name: RLS matrix — non-superuser roles, positive AND negative cases (blocking)
        shell: pwsh
        run: |
          . ./scripts/migration-rehearsal/lib/Common.ps1
          Get-ArgusLocalEnv | Out-Null
          $m = Invoke-ArgusPsql -SqlFile "./scripts/migration-rehearsal/sql/rls-matrix-checks.sql" -AllowFailure
          $m.Output | ForEach-Object { Write-Host $_ }
          if ($m.ExitCode -ne 0) { Write-Error "RLS matrix aborted (exit $($m.ExitCode))"; exit 1 }
          $fails = @($m.Output | Select-String -Pattern "RLS_TEST_FAIL")
          if ($fails.Count -gt 0) { Write-Error "RLS_TEST_FAIL:`n$($fails -join "`n")"; exit 1 }
          $pos = @($m.Output | Select-String -Pattern "RLS_TEST_PASS \| positive").Count
          $neg = @($m.Output | Select-String -Pattern "RLS_TEST_PASS \| negative").Count
          $sec = @($m.Output | Select-String -Pattern "RLS_TEST_PASS \| role_security").Count
          $stub = @($m.Output | Select-String -Pattern "RLS_TEST_PASS \| helper_not_stub").Count
          Write-Host "RLS_POSITIVE_PASS=$pos RLS_NEGATIVE_PASS=$neg RLS_ROLE_SECURITY_PASS=$sec HELPERS_NOT_STUB=$stub"
          if ($pos -lt 5)  { Write-Error "Too few positive RLS cases ($pos) - a deny-everything suite is not RLS validation"; exit 1 }
          if ($neg -lt 10) { Write-Error "Too few negative RLS cases ($neg)"; exit 1 }
          if ($sec -lt 2)  { Write-Error "Role-security preconditions did not pass"; exit 1 }
          if ($stub -lt 3) { Write-Error "One or more RLS helpers is still a stub"; exit 1 }

      - name: Assert zero BYPASSRLS / superuser among application roles (blocking)
        shell: pwsh
        run: |
          . ./scripts/migration-rehearsal/lib/Common.ps1
          Get-ArgusLocalEnv | Out-Null
          $r = Invoke-ArgusPsql -SqlText "SELECT count(*) FROM pg_roles WHERE rolname IN ('app_api','ingest_worker','jobs_worker','audit_reader','readonly_inspector','migration_owner') AND (rolsuper OR rolbypassrls);"
          $r.Output | ForEach-Object { Write-Host $_ }
          if (($r.Output -join ' ') -notmatch '(^|\s)0(\s|$)') { Write-Error "An ARGUS role has SUPERUSER or BYPASSRLS"; exit 1 }

      - name: Helper/reconciliation/rollback contract tests (static, blocking)
        run: |
          npx vitest run \
            tests/database-target/rls-helper-is-owner.test.ts \
            tests/database-target/rls-helper-command-role.test.ts \
            tests/database-target/rls-helper-classification.test.ts \
            tests/database-target/rls-non-superuser.test.ts \
            tests/database-target/rls-no-bypassrls.test.ts \
            tests/database-target/rls-positive-access.test.ts \
            tests/database-target/rls-negative-access.test.ts \
            tests/database-target/risk-schema-reconciliation.test.ts \
            tests/database-target/command-schema-reconciliation.test.ts \
            tests/database-target/risk-escalation-no-direct-incident.test.ts \
            tests/database-target/command-membership-expiry.test.ts \
            tests/database-target/command-jurisdiction-access.test.ts \
            tests/database-target/schema-target-change-justification.test.ts \
            tests/database-target/rollback-object-ownership.test.ts

      - name: Rollback leaves ZERO ARGUS residue (blocking — full 100->000 cycle)
        shell: pwsh
        run: |
          . ./scripts/migration-rehearsal/lib/Common.ps1
          Get-ArgusLocalEnv | Out-Null
          # Baseline was captured before any wave applied? No — this job's
          # container already has 000-040 applied, so roll everything back and
          # compare against a freshly-reset database instead.
          $waves = @("000_preflight","010_foundation","020_identity","030_ingestion_observation_evidence","040_incident")
          foreach ($w in ($waves | Sort-Object -Descending)) {
            $dir = Join-Path (Join-Path $Script:ArgusRepoRoot "prisma/target-migrations") $w
            $r = & ./scripts/migration-rehearsal/Invoke-Wave.ps1 -WaveDir $dir -Rollback
            if (-not $r.Success) { Write-Error "Rollback of $w failed: $($r.Error)"; exit 1 }
          }
          $after = Invoke-ArgusPsql -SqlFile "./scripts/migration-rehearsal/sql/catalog-object-inventory.sql"
          $after.Output | Set-Content -Path "$env:RUNNER_TEMP/catalog-after.txt" -Encoding utf8
          # An empty baseline: everything ARGUS created must be gone, so any
          # non-extension, non-public, non-pg_toast object is residue.
          "" | Set-Content -Path "$env:RUNNER_TEMP/catalog-empty.txt" -Encoding utf8
          node ./scripts/migration-rehearsal/lib/classify-catalog-residue.mjs "$env:RUNNER_TEMP/catalog-empty.txt" "$env:RUNNER_TEMP/catalog-after.txt"
          if ($LASTEXITCODE -ne 0) { Write-Error "ROLLBACK_ZERO_RESIDUE_FAIL - ARGUS objects survived rollback"; exit 1 }
          Write-Host "ROLLBACK_ZERO_RESIDUE_PASS"

      - name: Wave 3/4 — tear down local Postgres/PostGIS
        if: always()
        shell: bash
        run: |
          docker compose --env-file .env.argus-migration.local -f docker-compose.argus-migration.yml down -v || true
          rm -f .env.argus-migration.local

      - name: Confirm prisma/schema.prisma and prisma/migrations/ are STILL untouched (post-run)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- prisma/schema.prisma prisma/migrations/)" ]; then
            echo "::error::prisma/schema.prisma or prisma/migrations/ was modified by the rehearsal — this must never happen."
            git status --porcelain -- prisma/schema.prisma prisma/migrations/
            exit 1
          fi

      # Fase 3 requirement: logs/artifacts are uploaded ONLY when the job
      # failed — never on a green run, and never containing production
      # data (the rehearsal database is synthetic/disposable).
      - name: Upload rehearsal logs (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: argus-database-rehearsal-logs
          path: |
            migration-rehearsal-logs/**
            migration-rehearsal-artifacts/**
          retention-days: 14
          if-no-files-found: warn
