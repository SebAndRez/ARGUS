name: ARGUS Database Rehearsal

# Runs the full local (Docker/PostGIS) target-database migration rehearsal
# in CI (Executable Migration Plan Fase 3). This workflow NEVER touches
# production: it never sets DATABASE_URL/DIRECT_URL to anything but the
# disposable container the rehearsal harness itself creates via
# docker-compose.argus-migration.yml, and it never runs `prisma migrate
# deploy`/`db push`/`db pull` against any real database. No production
# secrets are read here — the job declares zero `secrets:` inputs.
#
# scripts/migration-rehearsal/Invoke-ArgusFullRehearsal.ps1 already
# orchestrates, in one call: the 11-wave apply cycle, a same-volume
# reapply (backfills exercised twice), the full 100->000 rollback, a
# from-scratch second install, RLS runtime checks, physical validations,
# `prisma validate`, and the repo test suites — see that script's header
# comment for the exact phase-by-phase breakdown. This workflow does not
# reimplement any of that; it only invokes it and fails the job if it
# fails.

on:
  pull_request:
    paths:
      - "package.json"
      - "prisma/schema.target.prisma"
      - "prisma/target-migrations/**"
      - "scripts/migration-rehearsal/**"
      - "scripts/database-target/**"
      - "src/lib/database-target/**"
      - "tests/database-target/**"
      - "docker-compose.argus-migration.yml"
      - ".github/workflows/argus-database-rehearsal.yml"
  workflow_dispatch: {}

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # No `secrets:`/`env:` block reads any production credential. The only
    # database this job ever talks to is the disposable, loopback-bound
    # container the rehearsal harness creates and destroys itself.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Confirm prisma/schema.prisma and prisma/migrations/ are untouched (pre-run)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- prisma/schema.prisma prisma/migrations/)" ]; then
            echo "::error::prisma/schema.prisma or prisma/migrations/ has a diff before the rehearsal even started — refusing to proceed."
            git status --porcelain -- prisma/schema.prisma prisma/migrations/
            exit 1
          fi

      - name: Confirm Docker is available
        shell: bash
        run: docker info

      - name: prisma validate --schema prisma/schema.target.prisma
        run: npm run db:target:validate

      - name: Unit/contract tests (tests/database-target/)
        run: npm run db:target:test

      - name: Anti-remote-connection guard (assert-local-only.mjs unit tests)
        run: npx vitest run tests/database-target/target-migration-rehearsal-local-only-guard.test.ts tests/database-target/target-client-factory-anti-remote.test.ts

      - name: Full rehearsal — 11 waves, backfill x2, rollback, reinstall from scratch, RLS + physical + prisma + repo tests
        shell: pwsh
        run: |
          ./scripts/migration-rehearsal/Invoke-ArgusFullRehearsal.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Full rehearsal failed — see migration-rehearsal-logs/ and migration-rehearsal-artifacts/ (uploaded below)."
            exit 1
          }

      # ---------------------------------------------------------------------
      # Wave 3 — shadow-write integration proof (Fase 14 of the wave-3
      # mandate). Independent of the full-rehearsal step above (which tears
      # its own container down internally) — this brings up its own
      # disposable container, applies only the waves the wave-3 flow needs
      # (000/010/020/030/040), runs the real Docker/Postgres integration
      # test, then tears down. No secrets, no remote services — same
      # loopback-only container pattern as the full rehearsal.
      # ---------------------------------------------------------------------
      - name: Wave 3 — bring up local Postgres/PostGIS and apply waves 000-040
        shell: pwsh
        run: |
          ./scripts/migration-rehearsal/Reset-ArgusRehearsal.ps1
          . ./scripts/migration-rehearsal/lib/Common.ps1
          Get-ArgusLocalEnv | Out-Null
          Invoke-ArgusPsql -SqlFile "./scripts/migration-rehearsal/fixtures/000_legacy_synthetic_fixtures.sql" | Out-Null
          $waves = @("000_preflight", "010_foundation", "020_identity", "030_ingestion_observation_evidence", "040_incident")
          foreach ($w in $waves) {
            $dir = Join-Path (Join-Path $Script:ArgusRepoRoot "prisma/target-migrations") $w
            $r = & ./scripts/migration-rehearsal/Invoke-Wave.ps1 -WaveDir $dir
            if (-not $r.Success) {
              Write-Error "Wave $w failed during wave-3 setup — see migration-rehearsal-logs/."
              exit 1
            }
          }

      - name: Wave 3 — generate the isolated target Prisma client
        run: npx prisma generate --schema prisma/schema.target.prisma

      - name: Wave 3 — local shadow-write integration (IncidentCandidate creation, idempotency, zero Incident promotion)
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL=$(grep '^DATABASE_URL=' .env.argus-migration.local | cut -d= -f2-)
          export ARGUS_WAVE3_INTEGRATION_TEST=true
          export TARGET_DATABASE_URL="$DATABASE_URL"
          npx vitest run tests/database-target/wave3-local-integration.test.ts

      - name: Wave 3 — no-Incident-promotion + default-flags-off + anti-remote guard
        run: npx vitest run tests/database-target/wave3-no-incident-promotion.test.ts tests/database-target/target-feature-flags.test.ts tests/database-target/target-client-factory-anti-remote.test.ts

      # ---------------------------------------------------------------------
      # Wave 4 — IncidentPromotion/DiscardDecision/IncidentHypothesis
      # integration proof. Reuses the SAME already-up waves 000-040 container
      # from the Wave 3 section above (no second Docker bring-up needed —
      # incident.* also lives in wave 040) — runs before that container is
      # torn down.
      # ---------------------------------------------------------------------
      - name: Wave 4 — human/automated promotion, discard, hypothesis, idempotency, concurrency, audit, RLS coverage
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL=$(grep '^DATABASE_URL=' .env.argus-migration.local | cut -d= -f2-)
          export ARGUS_WAVE3_INTEGRATION_TEST=true
          export TARGET_DATABASE_URL="$DATABASE_URL"
          npx vitest run \
            tests/database-target/incident-promotion-human.test.ts \
            tests/database-target/incident-promotion-automated.test.ts \
            tests/database-target/incident-promotion-idempotency.test.ts \
            tests/database-target/incident-promotion-concurrency.test.ts \
            tests/database-target/discard-decision.test.ts \
            tests/database-target/incident-hypothesis.test.ts \
            tests/database-target/incident-promotion-audit.test.ts \
            tests/database-target/wave4-local-integration.test.ts

      - name: Wave 4 — no-direct-Incident-creation + RLS structural coverage (no Docker needed, but confirmed here alongside the rest of wave 4)
        run: npx vitest run tests/database-target/wave4-no-direct-incident-creation.test.ts tests/database-target/incident-promotion-rls.test.ts

      # ---------------------------------------------------------------------
      # security.audit_logs monthly partition lifecycle. Reuses the SAME
      # already-up waves-000-040 container as the wave 3/4 sections above.
      #
      # Every case here is BLOCKING. The bug this covers was not theoretical:
      # audit_logs shipped with a single July-2026 partition and no DEFAULT
      # partition, so every legitimate audit write outside that month failed
      # with "no partition of relation \"audit_logs\" found for row".
      #
      # No production secrets, no remote TARGET_DATABASE_URL: the URL comes
      # from .env.argus-migration.local, i.e. the disposable loopback
      # container the harness created itself, and target-client-factory-anti-
      # remote.test.ts (run below) asserts that a non-loopback/managed URL is
      # refused outright.
      # ---------------------------------------------------------------------
      - name: Audit partitions — UTC bounds, naming, year boundary, leap year, concurrency, historical backfill, no DEFAULT, security, writer
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL=$(grep '^DATABASE_URL=' .env.argus-migration.local | cut -d= -f2-)
          export ARGUS_WAVE3_INTEGRATION_TEST=true
          export TARGET_DATABASE_URL="$DATABASE_URL"
          npx vitest run \
            tests/database-target/audit-log-partition-name.test.ts \
            tests/database-target/audit-log-partition-utc-bounds.test.ts \
            tests/database-target/audit-log-partition-window.test.ts \
            tests/database-target/audit-log-partition-no-default.test.ts \
            tests/database-target/audit-log-partition-security.test.ts \
            tests/database-target/audit-log-partition-idempotency.test.ts \
            tests/database-target/audit-log-partition-concurrency.test.ts \
            tests/database-target/audit-log-partition-year-boundary.test.ts \
            tests/database-target/audit-log-partition-leap-year.test.ts \
            tests/database-target/audit-log-backfill-partitions.test.ts \
            tests/database-target/audit-log-writer-ensures-partition.test.ts

      - name: Audit partitions — physical checks + real multi-connection concurrency + RLS matrix (blocking)
        shell: pwsh
        run: |
          . ./scripts/migration-rehearsal/lib/Common.ps1
          Get-ArgusLocalEnv | Out-Null
          $c = Invoke-ArgusPsql -SqlFile "./scripts/migration-rehearsal/sql/audit-partition-checks.sql" -AllowFailure
          $c.Output | ForEach-Object { Write-Host $_ }
          if ($c.ExitCode -ne 0) { Write-Error "audit-partition-checks.sql aborted (exit $($c.ExitCode))"; exit 1 }
          $fails = @($c.Output | Select-String -Pattern "AUDIT_PARTITION_[A-Z_]*FAIL")
          if ($fails.Count -gt 0) { Write-Error "AUDIT_PARTITION_FAIL:`n$($fails -join "`n")"; exit 1 }
          $text = $c.Output -join "`n"
          foreach ($m in @("AUDIT_PARTITION_PARENT_PASS","AUDIT_PARTITION_NO_DEFAULT_PASS","AUDIT_PARTITION_BOUNDS_PASS","AUDIT_PARTITION_INDEX_PASS","AUDIT_PARTITION_WINDOW_PASS","AUDIT_PARTITION_SECURITY_PASS","AUDIT_PARTITION_BACKFILL_PASS","AUDIT_PARTITION_RLS_PASS","AUDIT_PARTITION_MAINTENANCE_IDEMPOTENT_PASS")) {
            if ($text -notmatch [regex]::Escape($m)) { Write-Error "Required marker $m missing"; exit 1 }
          }
          $routing = @($c.Output | Select-String -Pattern "AUDIT_PARTITION_ROUTING_OK").Count
          if ($routing -lt 8) { Write-Error "Only $routing of 8 boundary instants routing-verified via tableoid"; exit 1 }
          Write-Host "AUDIT_PARTITION_ROUTING_VERIFIED=$routing"

      # ---------------------------------------------------------------------
      # Persisted authorization: security.access_subjects /
      # security.access_role_assignments, and the REAL principal of the
      # canonical audit writer.
      #
      # Every case here is BLOCKING. The defect being locked out is not
      # theoretical: `fn_classification_allowed` used to read the
      # `argus.actor_role` session GUC and believe it, so any principal able to
      # run `SET argus.actor_role = 'ADMIN'` had CRITICAL clearance; and the
      # audit writer connected as the migration owner (superuser, BYPASSRLS,
      # owner of the schema/table/functions), so no RLS policy or function grant
      # was ever exercised by the code that claimed to be constrained by them.
      #
      # No production secrets: the app_api / access_admin credentials are
      # generated per-run by the rehearsal harness into
      # .env.argus-migration.local, for the disposable loopback container only.
      # ---------------------------------------------------------------------
      - name: Access roles — give app_api/access_admin their local-only credentials
        shell: pwsh
        run: |
          . ./scripts/migration-rehearsal/lib/Common.ps1
          Get-ArgusLocalEnv | Out-Null
          Set-ArgusRuntimeRolePasswords

      - name: Access roles — subjects, assignments, classification matrix, forged-GUC denial, RLS (blocking)
        shell: pwsh
        run: |
          . ./scripts/migration-rehearsal/lib/Common.ps1
          Get-ArgusLocalEnv | Out-Null
          $c = Invoke-ArgusPsql -SqlFile "./scripts/migration-rehearsal/sql/access-role-checks.sql" -AllowFailure
          $c.Output | ForEach-Object { Write-Host $_ }
          if ($c.ExitCode -ne 0) { Write-Error "access-role-checks.sql aborted (exit $($c.ExitCode))"; exit 1 }
          $fails = @($c.Output | Select-String -Pattern "(ACCESS|CLASSIFICATION)_[A-Z_]*FAIL")
          if ($fails.Count -gt 0) { Write-Error "ACCESS_ROLE_FAIL:`n$($fails -join "`n")"; exit 1 }
          $text = $c.Output -join "`n"
          foreach ($m in @("ACCESS_SUBJECT_INTEGRITY_PASS","ACCESS_ROLE_ASSIGNMENT_PASS","CLASSIFICATION_PERSISTED_ROLE_PASS","CLASSIFICATION_FORGED_GUC_DENIED_PASS","ACCESS_ROLE_RLS_PASS")) {
            if ($text -notmatch [regex]::Escape($m)) { Write-Error "Required marker $m missing"; exit 1 }
          }
          $pos = @($c.Output | Select-String -Pattern "ACCESS_(MATRIX|ROLE_RLS)_OK \| positive").Count
          $neg = @($c.Output | Select-String -Pattern "ACCESS_(MATRIX|ROLE_RLS)_OK \| negative").Count
          Write-Host "ACCESS_POSITIVE_PASS=$pos ACCESS_NEGATIVE_PASS=$neg"
          if ($pos -lt 4) { Write-Error "Too few positive authorization cases ($pos) - a deny-everything suite proves nothing"; exit 1 }
          if ($neg -lt 8) { Write-Error "Too few negative authorization cases ($neg)"; exit 1 }

      - name: Access roles + audit writer principal — under the REAL app_api/access_admin credentials (blocking)
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL=$(grep '^DATABASE_URL=' .env.argus-migration.local | cut -d= -f2-)
          export ARGUS_WAVE3_INTEGRATION_TEST=true
          export TARGET_DATABASE_URL="$DATABASE_URL"
          export TARGET_RUNTIME_DATABASE_URL=$(grep '^TARGET_RUNTIME_DATABASE_URL=' .env.argus-migration.local | cut -d= -f2-)
          export TARGET_ADMIN_DATABASE_URL=$(grep '^TARGET_ADMIN_DATABASE_URL=' .env.argus-migration.local | cut -d= -f2-)
          npx vitest run \
            tests/database-target/audit-writer-principal.test.ts \
            tests/database-target/audit-writer-no-owner-runtime.test.ts \
            tests/database-target/access-subject.test.ts \
            tests/database-target/access-subject-exclusivity.test.ts \
            tests/database-target/access-role-assignment.test.ts \
            tests/database-target/access-role-assignment-idempotency.test.ts \
            tests/database-target/access-role-assignment-expiry.test.ts \
            tests/database-target/access-role-assignment-revocation.test.ts \
            tests/database-target/classification-with-persisted-role.test.ts \
            tests/database-target/classification-rejects-forged-guc.test.ts \
            tests/database-target/classification-institution-scope.test.ts \
            tests/database-target/classification-purpose.test.ts \
            tests/database-target/classification-emergency-basis.test.ts \
            tests/database-target/access-role-rls.test.ts

      - name: Access roles — static rollback contract + no session-GUC authority anywhere (no Docker)
        run: npx vitest run tests/database-target/access-role-rollback.test.ts tests/database-target/classification-rejects-forged-guc.test.ts

      # ---------------------------------------------------------------------
      # R31 — incident -> operational zone -> jurisdiction -> command scope.
      # BLOCKING. Proves that authorization now resolves through a PERSISTED
      # relation: PRIMARY/AFFECTED/MONITORING grant nothing, no spatial
      # intersection ever reaches COMMAND, and a jurisdictional mismatch is
      # refused. Uses only the disposable local database — no production
      # secret is referenced anywhere in this job.
      # ---------------------------------------------------------------------
      - name: R31 — incident/zone/jurisdiction relation, command matrix, spatial resolution (blocking)
        shell: pwsh
        run: |
          . ./scripts/migration-rehearsal/lib/Common.ps1
          Get-ArgusLocalEnv | Out-Null
          $c = Invoke-ArgusPsql -SqlFile "./scripts/migration-rehearsal/sql/incident-zone-checks.sql" -AllowFailure
          $c.Output | ForEach-Object { Write-Host $_ }
          if ($c.ExitCode -ne 0) { Write-Error "incident-zone-checks.sql aborted (exit $($c.ExitCode))"; exit 1 }
          $fails = @($c.Output | Select-String -Pattern "(INCIDENT_ZONE|INCIDENT_COMMAND|SPATIAL_RESOLUTION)_[A-Z_]*FAIL")
          if ($fails.Count -gt 0) { Write-Error "INCIDENT_ZONE_FAIL:`n$($fails -join "`n")"; exit 1 }
          $text = $c.Output -join "`n"
          foreach ($m in @(
            "INCIDENT_ZONE_RELATION_PASS","INCIDENT_ZONE_PRIMARY_UNIQUE_PASS",
            "INCIDENT_ZONE_SPATIAL_RESOLUTION_PASS","SPATIAL_RESOLUTION_NO_COMMAND_PASS",
            "INCIDENT_COMMAND_ZONE_PASS","INCIDENT_COMMAND_JURISDICTION_PASS",
            "INCIDENT_COMMAND_MISMATCH_DENIED_PASS","INCIDENT_COMMAND_REVOKED_DENIED_PASS",
            "INCIDENT_ZONE_RLS_PASS")) {
            if ($text -notmatch [regex]::Escape($m)) { Write-Error "Required marker $m missing"; exit 1 }
          }
          $pos = @($c.Output | Select-String -Pattern "INCIDENT_ZONE_OK \| positive").Count
          $neg = @($c.Output | Select-String -Pattern "INCIDENT_ZONE_OK \| negative").Count
          $str = @($c.Output | Select-String -Pattern "INCIDENT_ZONE_OK \| structure").Count
          Write-Host "INCIDENT_ZONE_POSITIVE_PASS=$pos INCIDENT_ZONE_NEGATIVE_PASS=$neg INCIDENT_ZONE_STRUCTURE_PASS=$str"
          if ($pos -lt 8)  { Write-Error "Too few positive R31 cases ($pos) - a deny-everything suite proves nothing"; exit 1 }
          if ($neg -lt 20) { Write-Error "Too few negative R31 cases ($neg)"; exit 1 }
          if ($str -lt 14) { Write-Error "Too few structural R31 assertions ($str)"; exit 1 }

      - name: R31 — command matrix under the REAL app_api/access_admin credentials (blocking)
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL=$(grep '^DATABASE_URL=' .env.argus-migration.local | cut -d= -f2-)
          export ARGUS_WAVE3_INTEGRATION_TEST=true
          export TARGET_DATABASE_URL="$DATABASE_URL"
          export TARGET_RUNTIME_DATABASE_URL=$(grep '^TARGET_RUNTIME_DATABASE_URL=' .env.argus-migration.local | cut -d= -f2-)
          export TARGET_ADMIN_DATABASE_URL=$(grep '^TARGET_ADMIN_DATABASE_URL=' .env.argus-migration.local | cut -d= -f2-)
          npx vitest run \
            tests/database-target/incident-operational-zone-assignment.test.ts \
            tests/database-target/incident-operational-zone-primary-unique.test.ts \
            tests/database-target/incident-operational-zone-command.test.ts \
            tests/database-target/incident-operational-zone-revocation.test.ts \
            tests/database-target/incident-operational-zone-idempotency.test.ts \
            tests/database-target/incident-operational-zone-concurrency.test.ts \
            tests/database-target/incident-zone-spatial-resolution.test.ts \
            tests/database-target/spatial-resolution-never-grants-command.test.ts \
            tests/database-target/incident-command-jurisdiction.test.ts \
            tests/database-target/incident-command-jurisdiction-mismatch.test.ts \
            tests/database-target/incident-command-without-command-zone.test.ts \
            tests/database-target/incident-primary-does-not-grant-command.test.ts \
            tests/database-target/incident-affected-does-not-grant-command.test.ts \
            tests/database-target/incident-command-membership-expiry.test.ts \
            tests/database-target/incident-command-role-expiry.test.ts \
            tests/database-target/incident-command-institution.test.ts \
            tests/database-target/incident-command-forged-context.test.ts \
            tests/database-target/incident-candidate-zone-promotion.test.ts \
            tests/database-target/incident-zone-rls.test.ts

      - name: R31 — static rollback contract (no Docker)
        run: npx vitest run tests/database-target/incident-zone-rollback.test.ts

      - name: Audit partitions — maintenance is OFF while every target flag is off, and never reads DATABASE_URL/DIRECT_URL
        # Deliberately runs with NO ARGUS_TARGET_DB_* variable and NO
        # TARGET_DATABASE_URL set: the flags-off path must return NOT_ENABLED
        # without constructing a client, so it must not need a URL at all.
        run: |
          npx vitest run \
            tests/database-target/audit-log-maintenance-disabled.test.ts \
            tests/database-target/audit-log-partition-observability-redaction.test.ts \
            tests/database-target/audit-log-partition-rollback.test.ts \
            tests/database-target/target-feature-flags.test.ts \
            tests/database-target/target-client-factory-anti-remote.test.ts

      # ---------------------------------------------------------------------
      # Corrective session — real RLS + zero-residue rollback + risk/command
      # reconciliation. Every one of these is BLOCKING: the mandate forbids
      # accepting "the script exited 0" as proof of rollback correctness, and
      # forbids declaring RLS working when only a superuser exercised it.
      # ---------------------------------------------------------------------
      - name: RLS matrix — non-superuser roles, positive AND negative cases (blocking)
        shell: pwsh
        run: |
          . ./scripts/migration-rehearsal/lib/Common.ps1
          Get-ArgusLocalEnv | Out-Null
          $m = Invoke-ArgusPsql -SqlFile "./scripts/migration-rehearsal/sql/rls-matrix-checks.sql" -AllowFailure
          $m.Output | ForEach-Object { Write-Host $_ }
          if ($m.ExitCode -ne 0) { Write-Error "RLS matrix aborted (exit $($m.ExitCode))"; exit 1 }
          $fails = @($m.Output | Select-String -Pattern "RLS_TEST_FAIL")
          if ($fails.Count -gt 0) { Write-Error "RLS_TEST_FAIL:`n$($fails -join "`n")"; exit 1 }
          $pos = @($m.Output | Select-String -Pattern "RLS_TEST_PASS \| positive").Count
          $neg = @($m.Output | Select-String -Pattern "RLS_TEST_PASS \| negative").Count
          $sec = @($m.Output | Select-String -Pattern "RLS_TEST_PASS \| role_security").Count
          $stub = @($m.Output | Select-String -Pattern "RLS_TEST_PASS \| helper_not_stub").Count
          Write-Host "RLS_POSITIVE_PASS=$pos RLS_NEGATIVE_PASS=$neg RLS_ROLE_SECURITY_PASS=$sec HELPERS_NOT_STUB=$stub"
          if ($pos -lt 5)  { Write-Error "Too few positive RLS cases ($pos) - a deny-everything suite is not RLS validation"; exit 1 }
          if ($neg -lt 10) { Write-Error "Too few negative RLS cases ($neg)"; exit 1 }
          if ($sec -lt 2)  { Write-Error "Role-security preconditions did not pass"; exit 1 }
          if ($stub -lt 3) { Write-Error "One or more RLS helpers is still a stub"; exit 1 }

      - name: Assert zero BYPASSRLS / superuser among application roles (blocking)
        shell: pwsh
        run: |
          . ./scripts/migration-rehearsal/lib/Common.ps1
          Get-ArgusLocalEnv | Out-Null
          $r = Invoke-ArgusPsql -SqlText "SELECT count(*) FROM pg_roles WHERE rolname IN ('app_api','ingest_worker','jobs_worker','audit_reader','readonly_inspector','migration_owner') AND (rolsuper OR rolbypassrls);"
          $r.Output | ForEach-Object { Write-Host $_ }
          if (($r.Output -join ' ') -notmatch '(^|\s)0(\s|$)') { Write-Error "An ARGUS role has SUPERUSER or BYPASSRLS"; exit 1 }

      - name: Helper/reconciliation/rollback contract tests (static, blocking)
        run: |
          npx vitest run \
            tests/database-target/rls-helper-is-owner.test.ts \
            tests/database-target/rls-helper-command-role.test.ts \
            tests/database-target/rls-helper-classification.test.ts \
            tests/database-target/rls-non-superuser.test.ts \
            tests/database-target/rls-no-bypassrls.test.ts \
            tests/database-target/rls-positive-access.test.ts \
            tests/database-target/rls-negative-access.test.ts \
            tests/database-target/risk-schema-reconciliation.test.ts \
            tests/database-target/command-schema-reconciliation.test.ts \
            tests/database-target/risk-escalation-no-direct-incident.test.ts \
            tests/database-target/command-membership-expiry.test.ts \
            tests/database-target/command-jurisdiction-access.test.ts \
            tests/database-target/schema-target-change-justification.test.ts \
            tests/database-target/rollback-object-ownership.test.ts

      - name: Rollback leaves ZERO ARGUS residue (blocking — full 100->000 cycle)
        shell: pwsh
        run: |
          . ./scripts/migration-rehearsal/lib/Common.ps1
          Get-ArgusLocalEnv | Out-Null
          # Baseline was captured before any wave applied? No — this job's
          # container already has 000-040 applied, so roll everything back and
          # compare against a freshly-reset database instead.
          $waves = @("000_preflight","010_foundation","020_identity","030_ingestion_observation_evidence","040_incident")
          foreach ($w in ($waves | Sort-Object -Descending)) {
            $dir = Join-Path (Join-Path $Script:ArgusRepoRoot "prisma/target-migrations") $w
            $r = & ./scripts/migration-rehearsal/Invoke-Wave.ps1 -WaveDir $dir -Rollback
            if (-not $r.Success) { Write-Error "Rollback of $w failed: $($r.Error)"; exit 1 }
          }
          $after = Invoke-ArgusPsql -SqlFile "./scripts/migration-rehearsal/sql/catalog-object-inventory.sql"
          $after.Output | Set-Content -Path "$env:RUNNER_TEMP/catalog-after.txt" -Encoding utf8
          # An empty baseline: everything ARGUS created must be gone, so any
          # non-extension, non-public, non-pg_toast object is residue.
          "" | Set-Content -Path "$env:RUNNER_TEMP/catalog-empty.txt" -Encoding utf8
          node ./scripts/migration-rehearsal/lib/classify-catalog-residue.mjs "$env:RUNNER_TEMP/catalog-empty.txt" "$env:RUNNER_TEMP/catalog-after.txt"
          if ($LASTEXITCODE -ne 0) { Write-Error "ROLLBACK_ZERO_RESIDUE_FAIL - ARGUS objects survived rollback"; exit 1 }
          Write-Host "ROLLBACK_ZERO_RESIDUE_PASS"

      # The dynamic audit partition set is the specific thing a name-based
      # rollback would have left behind, so it is asserted by name here rather
      # than only as an anonymous entry in the residue classifier's output.
      - name: Audit partitions leave ZERO residue after rollback (blocking)
        shell: pwsh
        run: |
          . ./scripts/migration-rehearsal/lib/Common.ps1
          Get-ArgusLocalEnv | Out-Null
          $r = Invoke-ArgusPsql -SqlFile "./scripts/migration-rehearsal/sql/audit-partition-residue.sql" -AllowFailure
          $r.Output | ForEach-Object { Write-Host $_ }
          if ($r.ExitCode -ne 0) { Write-Error "AUDIT_PARTITION_ROLLBACK_FAIL - residue query failed"; exit 1 }
          $residue = @($r.Output | Select-String -Pattern "AUDIT_PARTITION_RESIDUE\|")
          if ($residue.Count -gt 0) { Write-Error "AUDIT_PARTITION_ROLLBACK_FAIL - survived rollback:`n$($residue -join "`n")"; exit 1 }
          Write-Host "AUDIT_PARTITION_ROLLBACK_PASS"

      - name: Access role substrate leaves ZERO residue after rollback (blocking)
        shell: pwsh
        run: |
          . ./scripts/migration-rehearsal/lib/Common.ps1
          Get-ArgusLocalEnv | Out-Null
          $r = Invoke-ArgusPsql -SqlFile "./scripts/migration-rehearsal/sql/access-role-residue.sql" -AllowFailure
          $r.Output | ForEach-Object { Write-Host $_ }
          if ($r.ExitCode -ne 0) { Write-Error "ACCESS_ROLE_ROLLBACK_FAIL - residue query failed"; exit 1 }
          $residue = @($r.Output | Select-String -Pattern "ACCESS_ROLE_RESIDUE\|")
          if ($residue.Count -gt 0) { Write-Error "ACCESS_ROLE_ROLLBACK_FAIL - survived rollback:`n$($residue -join "`n")"; exit 1 }
          Write-Host "ACCESS_ROLE_ROLLBACK_PASS"

      - name: R31 substrate leaves ZERO residue after rollback (blocking)
        shell: pwsh
        run: |
          . ./scripts/migration-rehearsal/lib/Common.ps1
          Get-ArgusLocalEnv | Out-Null
          $r = Invoke-ArgusPsql -SqlFile "./scripts/migration-rehearsal/sql/incident-zone-residue.sql" -AllowFailure
          $r.Output | ForEach-Object { Write-Host $_ }
          if ($r.ExitCode -ne 0) { Write-Error "INCIDENT_ZONE_ROLLBACK_FAIL - residue query failed"; exit 1 }
          $residue = @($r.Output | Select-String -Pattern "INCIDENT_ZONE_RESIDUE\|")
          if ($residue.Count -gt 0) { Write-Error "INCIDENT_ZONE_ROLLBACK_FAIL - survived rollback:`n$($residue -join "`n")"; exit 1 }
          Write-Host "INCIDENT_ZONE_ROLLBACK_PASS"

      - name: Audit partitions + access roles + R31 — post-rollback no-residue assertions (blocking)
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL=$(grep '^DATABASE_URL=' .env.argus-migration.local | cut -d= -f2-)
          export ARGUS_WAVE3_INTEGRATION_TEST=true
          export TARGET_DATABASE_URL="$DATABASE_URL"
          npx vitest run \
            tests/database-target/audit-log-partition-no-residue.test.ts \
            tests/database-target/access-role-zero-residue.test.ts \
            tests/database-target/incident-zone-zero-residue.test.ts

      - name: Wave 3/4 — tear down local Postgres/PostGIS
        if: always()
        shell: bash
        run: |
          docker compose --env-file .env.argus-migration.local -f docker-compose.argus-migration.yml down -v || true
          rm -f .env.argus-migration.local

      - name: Confirm prisma/schema.prisma and prisma/migrations/ are STILL untouched (post-run)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- prisma/schema.prisma prisma/migrations/)" ]; then
            echo "::error::prisma/schema.prisma or prisma/migrations/ was modified by the rehearsal — this must never happen."
            git status --porcelain -- prisma/schema.prisma prisma/migrations/
            exit 1
          fi

      # Fase 3 requirement: logs/artifacts are uploaded ONLY when the job
      # failed — never on a green run, and never containing production
      # data (the rehearsal database is synthetic/disposable).
      - name: Upload rehearsal logs (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: argus-database-rehearsal-logs
          path: |
            migration-rehearsal-logs/**
            migration-rehearsal-artifacts/**
          retention-days: 14
          if-no-files-found: warn
